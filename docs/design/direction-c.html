/* ---------- Tokens ---------- */
:root{
  color-scheme:light;
  --ui:"Segoe UI Variable Text","Segoe UI Variable","Segoe UI",system-ui,sans-serif;
  --display:"Segoe UI Variable Display","Segoe UI Variable","Segoe UI",system-ui,sans-serif;
  --serif:"Lora",Georgia,"Times New Roman",serif;
  --nav-w:260px; --cp-w:380px; --tb-h:40px;

  --mica:
    radial-gradient(1100px 640px at -4% -8%, rgba(204,196,240,.62), transparent 70%),
    radial-gradient(1000px 620px at 62% -18%, rgba(193,212,238,.50), transparent 70%),
    radial-gradient(900px 760px at 4% 108%, rgba(190,226,219,.50), transparent 70%),
    radial-gradient(900px 700px at 104% 104%, rgba(214,208,238,.40), transparent 70%),
    #eceef2;
  --layer:rgba(251,251,251,.9);
  --layer-solid:#fbfbfb;
  --layer-stroke:rgba(0,0,0,.075);
  --layer-shadow:0 2px 14px rgba(40,40,80,.06), 0 0 1px rgba(0,0,0,.06);
  --pane:rgba(253,253,254,.74);
  --pane-solid:#f9f9fa;
  --card:#ffffff;
  --card-stroke:rgba(0,0,0,.08);
  --card-shadow:0 1px 2px rgba(0,0,0,.045);
  --card-shadow-hover:0 4px 12px rgba(0,0,0,.07), 0 1px 2px rgba(0,0,0,.05);
  --t1:#1b1b1b; --t2:#5b5b5b; --t3:#6d6d6d;
  --fill-hover:rgba(0,0,0,.042); --fill-press:rgba(0,0,0,.028); --fill-sel:rgba(0,0,0,.058); --fill-subtle:rgba(0,0,0,.038);
  --bubble:#eeeef2;
  --ctl:rgba(255,255,255,.82); --ctl-hover:rgba(249,249,249,.7); --ctl-stroke:rgba(0,0,0,.075); --ctl-stroke-b:rgba(0,0,0,.17);
  --divider:rgba(0,0,0,.08);
  --brand:#6b5ce7; --brand-h:#5e4fdb; --brand-p:#5243c7; --on-brand:#ffffff; --brand-fg:#5243c7; --brand-tint:#efedfd; --brand-stroke:#cdc6f8;
  --planner:#0f6cbd; --writer:#107c10; --editor:#9a3fb5; --designer:#c4500e;
  --writer-fill:#107c10; --on-writer:#ffffff; --writer-fill-h:#0e6d0e;
  --del-bg:#fde5e7; --del-fg:#a4262c; --ins-bg:#dcf2d8; --ins-fg:#0a5a0a;
  --warn:#9a5800; --warn-dot:#e3a21a;
  --kbd:rgba(0,0,0,.055);
  --acrylic:rgba(250,250,251,.86);
  --flyout-shadow:0 8px 16px rgba(0,0,0,.14), 0 0 2px rgba(0,0,0,.14);
  --thumb-stroke:rgba(0,0,0,.09);
  --tile-deck:#c43e1c; --tile-doc:#185abd; --tile-folder:#b07400;
}
html.dark{
  color-scheme:dark;
  --mica:
    radial-gradient(1100px 640px at -4% -8%, rgba(104,90,170,.24), transparent 70%),
    radial-gradient(1000px 620px at 62% -18%, rgba(64,92,140,.20), transparent 70%),
    radial-gradient(900px 760px at 4% 108%, rgba(52,108,100,.18), transparent 70%),
    #1f1f21;
  --layer:rgba(40,40,40,.94);
  --layer-solid:#282828;
  --layer-stroke:rgba(255,255,255,.06);
  --layer-shadow:0 2px 16px rgba(0,0,0,.3), 0 0 1px rgba(0,0,0,.5);
  --pane:rgba(44,44,46,.82);
  --pane-solid:#2c2c2e;
  --card:#313131;
  --card-stroke:rgba(255,255,255,.07);
  --card-shadow:0 1px 2px rgba(0,0,0,.28);
  --card-shadow-hover:0 4px 14px rgba(0,0,0,.36);
  --t1:#ffffff; --t2:#cfcfcf; --t3:#a9a9a9;
  --fill-hover:rgba(255,255,255,.055); --fill-press:rgba(255,255,255,.04); --fill-sel:rgba(255,255,255,.075); --fill-subtle:rgba(255,255,255,.055);
  --bubble:#3a3a3d;
  --ctl:rgba(255,255,255,.06); --ctl-hover:rgba(255,255,255,.09); --ctl-stroke:rgba(255,255,255,.07); --ctl-stroke-b:rgba(255,255,255,.04);
  --divider:rgba(255,255,255,.085);
  --brand:#a49afa; --brand-h:#b3abfb; --brand-p:#958af0; --on-brand:#17122f; --brand-fg:#bdb5ff; --brand-tint:rgba(164,154,250,.15); --brand-stroke:rgba(164,154,250,.4);
  --planner:#58a9f2; --writer:#62c462; --editor:#cf8cf0; --designer:#f59a5c;
  --writer-fill:#5cbf5c; --on-writer:#0a1f0a; --writer-fill-h:#6ccb6c;
  --del-bg:rgba(240,80,95,.2); --del-fg:#ffa3ac; --ins-bg:rgba(98,196,98,.2); --ins-fg:#aeeaae;
  --warn:#f2b54a; --warn-dot:#f2b54a;
  --kbd:rgba(255,255,255,.08);
  --acrylic:rgba(44,44,46,.88);
  --flyout-shadow:0 8px 20px rgba(0,0,0,.4), 0 0 2px rgba(0,0,0,.5);
  --thumb-stroke:rgba(255,255,255,.08);
  --tile-deck:#ff8c69; --tile-doc:#6ca6ff; --tile-folder:#f0b43c;
}
:root{
  --planner-tint:color-mix(in srgb, var(--planner) 14%, var(--layer-solid));
  --writer-tint:color-mix(in srgb, var(--writer) 14%, var(--layer-solid));
  --editor-tint:color-mix(in srgb, var(--editor) 14%, var(--layer-solid));
  --designer-tint:color-mix(in srgb, var(--designer) 14%, var(--layer-solid));
  --writer-stroke:color-mix(in srgb, var(--writer) 34%, transparent);
  --writer-soft:color-mix(in srgb, var(--writer) 8%, var(--layer-solid));
}

/* ---------- Base ---------- */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:400 14px/20px var(--ui);color:var(--t1);background:var(--mica);background-attachment:fixed;overflow:hidden;-webkit-font-smoothing:antialiased;letter-spacing:0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:default}
a{color:inherit;text-decoration:none}
.ic{flex:none;display:block}
.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--t1);outline-offset:1px;border-radius:4px}
::selection{background:color-mix(in srgb,var(--brand) 30%,transparent)}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--t1) 22%,transparent);border:4px solid transparent;background-clip:padding-box;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- Controls ---------- */
.btn{height:32px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;border-radius:4px;border:1px solid var(--ctl-stroke);border-bottom-color:var(--ctl-stroke-b);background:var(--ctl);color:var(--t1);font-size:14px;line-height:20px;white-space:nowrap;box-shadow:0 0 0 0 transparent}
.btn:hover{background:var(--ctl-hover)}
.btn .ic{color:var(--t2)}
.btn.accent{background:var(--brand);color:var(--on-brand);border-color:rgba(255,255,255,.08);border-bottom-color:rgba(0,0,0,.3);font-weight:600}
.btn.accent .ic{color:var(--on-brand)}
.btn.accent:hover{background:var(--brand-h)}
.btn.green{background:var(--writer-fill);color:var(--on-writer);border-color:rgba(255,255,255,.08);border-bottom-color:rgba(0,0,0,.28);font-weight:600}
.btn.green .ic{color:var(--on-writer)}
.btn.green:hover{background:var(--writer-fill-h)}
.btn.subtle{background:transparent;border-color:transparent}
.btn.subtle:hover{background:var(--fill-hover)}
.btn.sm{height:28px;padding:0 10px;font-size:13px}
.icon-btn{width:32px;height:32px;padding:0;border:0;background:transparent;border-radius:4px;display:inline-grid;place-items:center;color:var(--t2);flex:none}
.icon-btn:hover{background:var(--fill-hover);color:var(--t1)}
.icon-btn.sm{width:24px;height:24px}
.kbd{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:4px;background:var(--kbd);font-size:11px;color:var(--t2);letter-spacing:.01em}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.dot.planner{background:var(--planner)} .dot.writer{background:var(--writer)} .dot.editor{background:var(--editor)} .dot.designer{background:var(--designer)}
.vr{width:1px;height:20px;background:var(--divider);flex:none}

/* ---------- Title bar ---------- */
.titlebar{position:relative;z-index:5;height:var(--tb-h);display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;user-select:none;-webkit-app-region:drag}
.titlebar button,.titlebar .search{-webkit-app-region:no-drag}
.tb-left{display:flex;align-items:center;gap:8px;padding-left:14px;min-width:0;white-space:nowrap}
.app-name{font-size:12px;color:var(--t2)}
.tb-sep{width:1px;height:14px;background:color-mix(in srgb,var(--t1) 18%,transparent);margin:0 2px}
.project-name{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.var-chip{height:24px;display:inline-flex;align-items:center;gap:5px;padding:0 5px 0 7px;border-radius:4px;font-size:12px;color:var(--t2);background:var(--fill-subtle);border:0}
.var-chip:hover{background:var(--fill-sel)}
.search{width:400px;height:32px;display:flex;text-align:left;align-items:center;gap:8px;padding:0 6px 0 11px;border-radius:4px;background:var(--ctl);border:1px solid var(--ctl-stroke);color:var(--t3);font-size:13px}
.search .ph{flex:1}
.tb-right{display:flex;align-items:center;justify-content:flex-end;gap:6px;min-width:0;white-space:nowrap}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--t2);height:28px;padding:0 8px;border-radius:4px;border:0;background:transparent}
.sync:hover{background:var(--fill-hover)}
.sync .dot{width:7px;height:7px;background:var(--warn-dot);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn-dot) 22%,transparent)}
.tb-companion.on{background:var(--fill-sel);color:var(--t1)}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;background:#cdeef0;color:#00585e;flex:none;border:0;padding:0}
html.dark .avatar{background:#1f4f53;color:#bff0f2}
.captions{display:flex;margin-left:6px}
.cap{width:46px;height:var(--tb-h);display:grid;place-items:center;border:0;background:transparent;color:var(--t1);padding:0}
.cap:hover{background:var(--fill-hover)}
.cap.close:hover{background:#c42b1c;color:#fff}
.cap svg{shape-rendering:crispEdges}

/* ---------- Shell ---------- */
.main{display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr);height:calc(100vh - var(--tb-h))}
html.companion-open .main{grid-template-columns:var(--nav-w) minmax(0,1fr) var(--cp-w)}
.layer{position:relative;min-width:0;min-height:0;background:var(--layer);border:1px solid var(--layer-stroke);border-right:0;border-bottom:0;border-radius:8px 0 0 0;box-shadow:var(--layer-shadow);overflow:hidden}
html.companion-open .layer{border-right:1px solid var(--layer-stroke);border-radius:8px 8px 0 0}
.scroller{position:absolute;inset:0;overflow:auto;scroll-behavior:smooth}

/* ---------- Navigation ---------- */
.nav{display:flex;flex-direction:column;min-height:0;padding:0 4px 6px;user-select:none}
.nav-top{padding:0 0 2px}
.nav-scroll{flex:1;min-height:0;overflow:auto;overflow-x:hidden;padding-bottom:8px}
.nav-scroll::-webkit-scrollbar{width:6px}
.nav-bottom{border-top:1px solid transparent;padding-top:4px}
.nv{position:relative;display:flex;align-items:center;gap:12px;height:36px;margin:2px 0;padding:0 10px 0 12px;border-radius:4px;font-size:14px;color:var(--t1);white-space:nowrap;border:0;background:transparent;width:100%;text-align:left}
.nv:hover{background:var(--fill-hover)}
.nv.sel{background:var(--fill-sel)}
.nv.sel::before{content:"";position:absolute;left:0;top:50%;width:3px;height:16px;margin-top:-8px;border-radius:2px;background:var(--brand)}
.nv .ic{color:var(--t1)}
.nv .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.nv .chev{color:var(--t2)}
.nv.ham{width:40px;padding:0;justify-content:center;margin-top:4px}
.nv .badge{min-width:16px;height:16px;padding:0 5px;border-radius:8px;background:var(--brand);color:var(--on-brand);font-size:11px;line-height:16px;font-weight:600;text-align:center}
.tree{margin:0 0 4px}
.tsub{display:flex;align-items:center;height:28px;padding:0 6px 0 44px;margin-top:4px;font-size:12px;color:var(--t3)}
.tsub span{flex:1}
.mini{width:24px;height:24px;display:grid;place-items:center;border:0;background:transparent;border-radius:4px;color:var(--t3);opacity:.85}
.mini:hover{background:var(--fill-hover);color:var(--t1)}
.nv.tv{height:32px;margin:1px 0;font-size:13px;gap:0;padding:0 8px 0 22px}
.nv.tv .tchev{color:var(--t2);margin-right:4px}
.nv.tv .ic.doc{color:var(--t2);margin-right:6px}
.nv.tv.note{padding-left:42px}
.nv.tv.leaf{padding-left:64px}
.nv.tv.leaf.sel{font-weight:600}
.tkids{position:relative}
.tkids::before{content:"";position:absolute;left:49px;top:4px;bottom:4px;width:1px;background:var(--divider)}

/* ---------- Sketch document ---------- */
.sheet{max-width:1060px;margin:0 auto;padding:26px 36px 96px}
.crumbs{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--t2);min-width:0}
.crumbs a{display:inline-flex;align-items:center;gap:6px;padding:2px 4px;margin:0 -4px;border-radius:4px;white-space:nowrap}
.crumbs a:hover{background:var(--fill-hover);color:var(--t1)}
.crumbs .ic{color:var(--t2)}
.crumbs .sep{color:var(--t3)}
.title-row{display:flex;align-items:center;gap:16px;margin-top:10px}
.title-row h1{flex:1;min-width:0;margin:0;font:600 28px/36px var(--display);letter-spacing:-.005em}
.cmdbar{display:flex;align-items:center;gap:4px;flex:none}
.cmdbar .vr{margin:0 4px}
.desc{margin:6px 0 0;max-width:720px;color:var(--t2);font-size:14px;line-height:20px}
.desc strong{color:var(--t1);font-weight:600}
.meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:12px;font-size:12px;line-height:16px;color:var(--t2)}
.meta .sepdot{color:var(--t3)}
.state{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px 0 6px;border-radius:10px;background:var(--brand-tint);color:var(--brand-fg);font-weight:600}
.ontarget{display:inline-flex;align-items:center;gap:5px}
.ontarget .ic{color:var(--writer)}
.mini-av{width:16px;height:16px;border-radius:50%;display:inline-grid;place-items:center;font-size:8px;font-weight:700;background:#cdeef0;color:#00585e}
html.dark .mini-av{background:#1f4f53;color:#bff0f2}

/* Details flyout */
.details-wrap{position:relative}
.flyout{position:absolute;right:0;top:38px;width:300px;padding:6px;border-radius:8px;background:var(--acrylic);backdrop-filter:blur(30px) saturate(1.3);border:1px solid var(--card-stroke);box-shadow:var(--flyout-shadow);z-index:20;display:none}
.flyout.open{display:block}
.prop{display:grid;grid-template-columns:110px 1fr;gap:8px;padding:7px 10px;font-size:13px;border-radius:4px}
.prop:hover{background:var(--fill-hover)}
.prop dt{color:var(--t2)} .prop dd{margin:0}

/* InfoBar */
.infobar{position:sticky;top:10px;z-index:4;display:flex;align-items:center;gap:12px;min-height:48px;margin:22px 0 14px;padding:7px 8px 7px 14px;border-radius:6px;background:var(--writer-soft);border:1px solid var(--writer-stroke);box-shadow:0 2px 8px rgba(0,0,0,.04)}
html.dark .infobar{background:color-mix(in srgb,var(--writer) 11%, #262626)}
.infobar .ib-ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--writer-fill);color:var(--on-writer);flex:none}
.infobar .ib-text{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.infobar .ib-text b{font-weight:600}
.infobar .ib-text span{color:var(--t2);margin-left:6px}
.infobar .ib-actions{display:flex;align-items:center;gap:6px;flex:none}
.infobar.done{background:var(--layer-solid);border-color:var(--card-stroke)}
.infobar.hidden{display:none}

/* Rows */
.rows{display:flex;flex-direction:column;gap:10px}
.row-card{position:relative;display:grid;grid-template-columns:18px 78px minmax(0,1fr) 196px 160px;column-gap:16px;padding:16px 16px 16px 12px;border-radius:8px;background:var(--card);border:1px solid var(--card-stroke);box-shadow:var(--card-shadow);transition:box-shadow .15s, border-color .15s}
.row-card:hover{box-shadow:var(--card-shadow-hover)}
.row-card:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.row-card.is-sugg{border-color:var(--writer-stroke);box-shadow:0 0 0 3px color-mix(in srgb,var(--writer) 7%,transparent), var(--card-shadow)}
.row-card.flash{animation:flash 1.2s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 4px color-mix(in srgb,var(--writer) 28%,transparent)}100%{box-shadow:var(--card-shadow)}}
.r-num{font-size:12px;line-height:20px;color:var(--t3);text-align:right;padding-top:1px}
.r-time .tm{font-size:13px;line-height:20px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.r-time .dur{font-size:12px;line-height:16px;color:var(--t3);font-variant-numeric:tabular-nums;margin-top:2px}
.r-narr{min-width:0}
.narr{margin:0;font:400 15px/24px var(--serif);color:var(--t1);text-wrap:pretty}
.narr strong{font-weight:600}
.narr del{text-decoration:line-through;text-decoration-thickness:1px;text-decoration-color:color-mix(in srgb,var(--del-fg) 75%,transparent);background:var(--del-bg);color:var(--del-fg);border-radius:3px;padding:1px 2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.narr ins{text-decoration:none;background:var(--ins-bg);color:var(--ins-fg);border-radius:3px;padding:1px 2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.claim{text-decoration:underline dotted;text-decoration-color:var(--warn);text-decoration-thickness:1.5px;text-underline-offset:4px}
.caret{display:inline-block;width:2px;height:18px;margin:0 0 -4px 1px;background:var(--writer);border-radius:1px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}
.sugg-head{display:flex;align-items:center;gap:4px;margin:-3px 0 8px}
.agent-chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px 0 7px;border-radius:11px;font-size:12px;font-weight:600;white-space:nowrap}
.agent-chip.writer{background:var(--writer-tint);color:color-mix(in srgb,var(--writer) 82%,var(--t1))}
.sugg-head .icon-btn.ok{color:var(--writer)}
.sugg-head .icon-btn.ok:hover{background:var(--writer-tint)}
.sugg-head .icon-btn.no:hover{background:var(--del-bg);color:var(--del-fg)}
.sugg-head .meta-r{margin-left:auto;font-size:12px;color:var(--t3);white-space:nowrap}
.row-foot{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px 0 7px;border-radius:11px;background:var(--fill-subtle);font-size:12px;color:var(--t2);white-space:nowrap}
.pill .wave{color:var(--brand-fg)}
.pill.flag{background:transparent;padding-left:2px;color:var(--warn)}
.editing{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;line-height:16px}
.editing .pulse{width:6px;height:6px;border-radius:50%;background:var(--writer);box-shadow:0 0 0 0 color-mix(in srgb,var(--writer) 40%,transparent);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--writer) 45%,transparent)}100%{box-shadow:0 0 0 7px transparent}}
.shimmer{font-weight:600;background:linear-gradient(90deg,var(--t3) 0%,var(--t3) 35%,var(--writer) 50%,var(--t3) 65%,var(--t3) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 2.2s linear infinite}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-50% 0}}
.editing .bar{flex:1;max-width:140px;height:2px;border-radius:1px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--writer) 55%,transparent),transparent);background-size:200% 100%;animation:shimmer 1.8s linear infinite}
html.shot .shimmer,html.shot .editing .bar{animation:none;background-position:55% 0}
html.shot .caret{animation:none}
.resolved{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--t2)}
.resolved .ic{color:var(--writer)}
.resolved button{border:0;background:transparent;color:var(--brand-fg);font-size:12px;padding:0 2px;font-weight:600}
.r-act{min-width:0}
.r-act ul{margin:0;padding:0;list-style:none;font-size:13px;line-height:20px;color:var(--t1)}
.r-act li{position:relative;padding-left:14px;margin-bottom:4px}
.r-act li::before{content:"";position:absolute;left:2px;top:9px;width:4px;height:4px;border-radius:50%;background:var(--t3)}
.r-act strong{font-weight:600}
.r-act em{font-style:normal;padding:0 3px;border-radius:3px;background:var(--fill-subtle)}
.r-shot .thumb{display:block;width:160px;aspect-ratio:16/10;border-radius:4px;overflow:hidden;border:1px solid var(--thumb-stroke);background:#f6f7f9;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.r-shot .thumb img{display:block;width:100%;height:100%;object-fit:cover}
.r-shot .empty{width:160px;aspect-ratio:16/10;border-radius:4px;border:1px dashed color-mix(in srgb,var(--t1) 18%,transparent);background:var(--fill-press);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--t3);font-size:12px;line-height:16px}
.r-shot .empty:hover{background:var(--fill-hover);color:var(--t2)}
.r-shot .empty .hint{font-size:11px;opacity:.85}
.add-row{display:flex;align-items:center;gap:8px;margin-top:10px}
.foot-hint{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:18px;font-size:12px;color:var(--t3)}

/* ---------- Companion ---------- */
.companion{display:none;flex-direction:column;min-width:0;min-height:0;margin-left:6px;position:relative;overflow:hidden;background:var(--pane);border:1px solid var(--layer-stroke);border-right:0;border-bottom:0;border-radius:8px 0 0 0;box-shadow:var(--layer-shadow)}
html.companion-open .companion{display:flex}
.companion::before{content:"";position:absolute;left:0;right:0;top:0;height:240px;pointer-events:none;background:radial-gradient(360px 180px at 18% -30px,color-mix(in srgb,var(--writer) 11%,transparent),transparent 72%)}
.cp-head{position:relative;padding:8px 8px 10px 12px;border-bottom:1px solid var(--divider)}
.cp-row{display:flex;align-items:center;gap:2px}
.agent-picker{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 6px 0 8px;margin-left:-4px;border:0;background:transparent;border-radius:4px;font-weight:600;font-size:14px}
.agent-picker:hover{background:var(--fill-hover)}
.agent-picker .ic{color:var(--t2)}
.cp-row .sp{flex:1}
.cp-title{font-size:13px;line-height:18px;color:var(--t2);margin-top:1px;padding-left:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-thread{position:relative;flex:1;min-height:0;overflow:auto;padding:14px 16px 16px;display:flex;flex-direction:column;gap:14px}
.day{align-self:center;font-size:12px;color:var(--t3)}
.msg-user{align-self:flex-end;max-width:88%;padding:9px 12px;border-radius:8px;background:var(--bubble);font-size:14px;line-height:20px}
.activity{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 8px;margin:-4px 0 -6px -8px;border:0;background:transparent;border-radius:4px;font-size:13px;color:var(--t2)}
.activity:hover{background:var(--fill-hover)}
.activity .ic{color:var(--t3)}
.msg-ai .who{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px;font-weight:600}
.w-av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--writer-tint);color:var(--writer);flex:none}
.msg-ai .body p{margin:0 0 8px}
.msg-ai .body ul{margin:0 0 8px;padding-left:18px}
.msg-ai .body li{margin-bottom:4px}
.msg-ai .body li::marker{color:var(--t3)}
.msg-ai .body strong{font-weight:600}
.flagline{display:flex;gap:8px;padding:8px 10px;border-radius:6px;background:color-mix(in srgb,var(--warn-dot) 12%,transparent);font-size:13px;line-height:19px;margin-top:2px}
.flagline .ic{color:var(--warn);margin-top:2px}
.reactions{display:flex;gap:2px;margin:6px 0 0 -6px}
.reactions .icon-btn{width:28px;height:28px;color:var(--t3)}
.sugg-card{border-radius:8px;background:var(--card);border:1px solid var(--card-stroke);box-shadow:var(--card-shadow);overflow:hidden}
.sc-head{display:flex;align-items:center;gap:10px;padding:12px 12px 8px}
.sc-tile{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;background:var(--writer-tint);color:var(--writer);flex:none}
.sc-title{font-size:13px;line-height:18px;font-weight:600}
.sc-sub{font-size:12px;line-height:16px;color:var(--t3)}
.sc-list{margin:0;padding:0 12px 10px;list-style:none}
.sc-list li{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:13px;border-top:1px solid var(--divider)}
.sc-list li:first-child{border-top:0}
.sc-list .rn{font-size:12px;color:var(--t3);width:38px;flex:none;font-variant-numeric:tabular-nums}
.sc-list .what{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-list .delta{font-size:12px;color:var(--t3);font-variant-numeric:tabular-nums}
.sc-list .st-ok{color:var(--writer);font-size:12px;font-weight:600}
.sc-actions{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px 10px 6px;border-top:1px solid var(--divider);background:color-mix(in srgb,var(--writer) 3%,transparent)}
.sc-actions .btn.subtle{color:var(--brand-fg);font-weight:600}
.cp-composer{position:relative;padding:10px 12px 10px;border-top:1px solid transparent}
.chips{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px 0 8px;border-radius:13px;border:1px solid var(--ctl-stroke);background:transparent;font-size:12px;color:var(--t2)}
.chip:hover{background:var(--fill-hover)}
.chip.on.writer{background:var(--writer-tint);border-color:var(--writer-stroke);color:color-mix(in srgb,var(--writer) 80%,var(--t1));font-weight:600}
.chip.on.planner{background:var(--planner-tint);border-color:color-mix(in srgb,var(--planner) 34%,transparent);color:color-mix(in srgb,var(--planner) 80%,var(--t1));font-weight:600}
.composer{border-radius:8px;background:var(--card);border:1px solid var(--ctl-stroke);border-bottom-color:var(--ctl-stroke-b);box-shadow:0 2px 6px rgba(0,0,0,.05);padding:8px 8px 6px 12px}
.composer:focus-within{border-bottom:2px solid var(--brand);padding-bottom:5px}
.ctx{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px 0 6px;border-radius:4px;background:var(--fill-subtle);font-size:12px;color:var(--t2);margin-top:2px}
.ctx .ic{color:var(--t2)}
.composer textarea{display:block;width:100%;border:0;outline:0;resize:none;background:transparent;font-size:14px;line-height:20px;padding:8px 0 4px;color:var(--t1);height:52px}
.composer textarea::placeholder{color:var(--t3);opacity:1}
.ctools{display:flex;align-items:center;gap:2px}
.ctools .sp{flex:1}
.model{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 6px 0 8px;border:0;background:transparent;border-radius:4px;font-size:12px;color:var(--t2)}
.model:hover{background:var(--fill-hover)}
.sendbtn{width:32px;height:32px;border-radius:4px;border:0;display:grid;place-items:center;background:var(--brand);color:var(--on-brand);padding:0}
.sendbtn:hover{background:var(--brand-h)}
.disclaimer{margin-top:8px;text-align:center;font-size:11px;line-height:14px;color:var(--t3)}

/* ---------- Home ---------- */
.home{max-width:900px;margin:0 auto;padding:40px 40px 80px}
.home h1{margin:0;font:600 28px/36px var(--display);letter-spacing:-.005em}
.home .lede{margin:6px 0 0;color:var(--t2)}
.hello{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--t2);margin-bottom:6px}
.hello .ic{color:var(--brand-fg)}
.prompt{margin-top:22px;border-radius:8px;background:var(--card);border:1px solid var(--ctl-stroke);border-bottom-color:var(--ctl-stroke-b);box-shadow:0 4px 16px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);padding:14px 12px 10px 16px}
.prompt textarea{display:block;width:100%;border:0;outline:0;resize:none;background:transparent;font-size:15px;line-height:22px;height:68px;padding:0;color:var(--t1)}
.prompt textarea::placeholder{color:var(--t3);opacity:1}
.prompt .ptools{display:flex;align-items:center;gap:6px;margin-top:6px}
.prompt .chips{margin:0}
.prompt .sp{flex:1}
.starters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}
.starter{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px;border-radius:8px;background:var(--card);border:1px solid var(--card-stroke);box-shadow:var(--card-shadow);text-align:left;transition:box-shadow .15s}
.starter:hover{box-shadow:var(--card-shadow-hover)}
.tile{width:36px;height:36px;border-radius:6px;display:grid;place-items:center;flex:none}
.tile.deck{background:color-mix(in srgb,var(--tile-deck) 14%,var(--layer-solid));color:var(--tile-deck)}
.tile.doc{background:color-mix(in srgb,var(--tile-doc) 14%,var(--layer-solid));color:var(--tile-doc)}
.tile.blank{background:var(--brand-tint);color:var(--brand-fg)}
.tile.folder{background:color-mix(in srgb,var(--tile-folder) 16%,var(--layer-solid));color:var(--tile-folder)}
.starter .st-t{font-size:14px;line-height:20px;font-weight:600}
.starter .st-s{font-size:12px;line-height:16px;color:var(--t2);margin-top:2px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:28px 0 10px}
.sec-h h2{margin:0;font-size:14px;line-height:20px;font-weight:600}
.sec-h a{font-size:13px;color:var(--brand-fg)}
.continue{display:flex;align-items:center;gap:18px;padding:12px 16px 12px 12px;border-radius:8px;background:var(--card);border:1px solid var(--card-stroke);box-shadow:var(--card-shadow)}
.continue .thumb{width:176px;aspect-ratio:16/10;border-radius:4px;overflow:hidden;border:1px solid var(--thumb-stroke);flex:none}
.continue .thumb img{width:100%;height:100%;display:block;object-fit:cover}
.continue .ci{flex:1;min-width:0}
.continue .ct{font:600 20px/28px var(--display)}
.continue .cs{font-size:13px;color:var(--t2);margin-top:2px}
.continue .cchips{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:4px;background:var(--fill-subtle);font-size:12px;color:var(--t2);white-space:nowrap}
.tag.writer{background:var(--writer-tint);color:color-mix(in srgb,var(--writer) 82%,var(--t1));font-weight:600}
.tag.repo{background:var(--planner-tint);color:color-mix(in srgb,var(--planner) 85%,var(--t1));font-weight:600}
.list{border-radius:8px;background:var(--card);border:1px solid var(--card-stroke);box-shadow:var(--card-shadow);overflow:hidden}
.li{display:grid;grid-template-columns:36px minmax(0,1fr) 230px 96px 28px;align-items:center;gap:14px;padding:10px 12px 10px 14px;border-top:1px solid var(--divider)}
.li:first-child{border-top:0}
.li:hover{background:var(--fill-press)}
.li .tile{width:36px;height:36px}
.li .nm{display:flex;align-items:center;gap:8px;font-size:14px;line-height:20px;font-weight:600;min-width:0}
.li .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .pth{font-size:12px;line-height:16px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.li .var{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--t2);min-width:0;white-space:nowrap}
.li .var span{overflow:hidden;text-overflow:ellipsis}
.li .when{font-size:12px;color:var(--t2);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.li .icon-btn{width:28px;height:28px}

/* ---------- Floating Writer button, toast, switcher ---------- */
.fab{display:none;position:fixed;right:24px;bottom:24px;z-index:30;align-items:center;gap:8px;height:40px;padding:0 16px 0 8px;border-radius:20px;background:var(--acrylic);backdrop-filter:blur(30px) saturate(1.4);border:1px solid var(--card-stroke);box-shadow:0 8px 24px rgba(0,0,0,.14),0 1px 3px rgba(0,0,0,.08);font-size:14px;font-weight:600;color:var(--t1)}
.fab:hover{background:var(--card)}
.fab .w-av{width:26px;height:26px}
.fab .count{position:absolute;top:-7px;right:-6px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--writer-fill);color:var(--on-writer);font-size:11px;line-height:16px;font-weight:700;text-align:center;border:2px solid var(--layer-solid);font-variant-numeric:tabular-nums}
.toast{position:fixed;right:20px;bottom:20px;z-index:40;width:340px;display:flex;gap:12px;align-items:flex-start;padding:12px 12px 12px 14px;border-radius:8px;background:var(--acrylic);backdrop-filter:blur(30px);border:1px solid var(--card-stroke);box-shadow:var(--flyout-shadow);transform:translateY(16px);opacity:0;pointer-events:none;transition:.2s}
.toast.show{transform:none;opacity:1;pointer-events:auto}
.toast .ti{color:var(--writer);margin-top:1px}
.toast b{display:block;font-weight:600;font-size:14px}
.toast small{display:block;color:var(--t2);font-size:12px;line-height:16px;margin-top:2px}
.toast .btn{margin-left:auto}
.switcher{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:var(--acrylic);backdrop-filter:blur(30px) saturate(1.3);border:1px solid var(--card-stroke);box-shadow:var(--flyout-shadow);font-size:12px;user-select:none}
.switcher button{height:28px;padding:0 12px;border:0;border-radius:14px;background:transparent;color:var(--t2);display:inline-flex;align-items:center;gap:6px}
.switcher button:hover{background:var(--fill-hover);color:var(--t1)}
.switcher button.on{background:var(--brand);color:var(--on-brand);font-weight:600}
.switcher .lbl{padding:0 8px 0 10px;color:var(--t3)}
.switcher .vr{height:16px;margin:0 4px}
html.shot .switcher{display:none}

/* ---------- Responsive: below 1440px ---------- */
@media (max-width:1439.98px){
  :root{--nav-w:48px}
  html.companion-open .main{grid-template-columns:var(--nav-w) minmax(0,1fr)}
  html.companion-open .layer{border-right:0;border-radius:8px 0 0 0}
  .nav{padding:0 4px 6px}
  .nv{width:40px;padding:0;justify-content:center;gap:0}
  .nv .lbl,.nv .chev,.tree{display:none}
  .nv .badge{position:absolute;top:4px;right:3px;min-width:14px;height:14px;padding:0 4px;font-size:10px;line-height:14px}
  .nv.child-sel{background:var(--fill-sel)}
  .nv.child-sel::before{content:"";position:absolute;left:0;top:50%;width:3px;height:16px;margin-top:-8px;border-radius:2px;background:var(--brand)}
  html.companion-open .companion{position:fixed;z-index:35;top:calc(var(--tb-h) + 6px);right:8px;bottom:8px;width:var(--cp-w);margin:0;border-radius:8px;border:1px solid var(--card-stroke);background:var(--acrylic);backdrop-filter:blur(40px) saturate(1.4);box-shadow:0 16px 40px rgba(0,0,0,.2),0 0 2px rgba(0,0,0,.2)}
  html.view-sketch:not(.companion-open) .fab{display:inline-flex}
  .sheet{padding:24px 40px 96px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Rail toggled by the hamburger on wide windows */
html.rail{--nav-w:48px}
html.rail .nv{width:40px;padding:0;justify-content:center;gap:0}
html.rail .nv .lbl,html.rail .nv .chev,html.rail .tree{display:none}
html.rail .nv .badge{position:absolute;top:4px;right:3px;min-width:14px;height:14px;padding:0 4px;font-size:10px;line-height:14px}
html.rail .nv.child-sel{background:var(--fill-sel)}
html.rail .nv.child-sel::before{content:"";position:absolute;left:0;top:50%;width:3px;height:16px;margin-top:-8px;border-radius:2px;background:var(--brand)}
/* ---------- responsive: fit the window ---------- */
.search{width:clamp(160px,30vw,400px)}
.scroller{container-type:inline-size}
.starters{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
@media (max-width:1280px){
  .app-name,.tb-sep{display:none}
  .sync{font-size:0;gap:0}
}
@media (max-width:860px){
  .search{width:36px;padding:0;justify-content:center}
  .search>*:not(svg){display:none}
  .var-chip{display:none}
}
@container (max-width:780px){
  .row-card{grid-template-columns:18px 64px minmax(0,1fr) 140px;row-gap:10px}
  .row-card .r-num{grid-row:1/3}
  .row-card .r-time{grid-row:1/3}
  .row-card .r-narr{grid-column:3}
  .row-card .r-shot{grid-column:4;grid-row:1/3}
  .row-card .r-act{grid-column:3;grid-row:2}
  .li{grid-template-columns:36px minmax(0,1fr) 72px 28px}
  .li .var{display:none}
  .sheet{padding-left:20px!important;padding-right:20px!important}
}
@container (max-width:520px){
  .row-card{grid-template-columns:18px minmax(0,1fr)}
  .row-card .r-time{grid-column:2;grid-row:auto}
  .row-card .r-narr,.row-card .r-act,.row-card .r-shot{grid-column:2;grid-row:auto}
  .row-card .r-num{grid-row:1/6}
}
.search kbd{white-space:nowrap}
[class*=switch] *{white-space:nowrap}
</style>
</head>

function narrHTML(r) {
  if (!r.sugg) return md(r.narrative);
  const st = S.sugg[r.sugg.id];
  if (st === 'accepted') return r.sugg.accepted;
  if (st === 'rejected') return md(r.narrative);
  return r.sugg.segs.map(([k, v]) =>
    k === 't' ? esc(v) :
    k === 'd' ? '<del>' + esc(v) + '</del>' :
    k === 'i' ? '<ins>' + esc(v) + '</ins>' :
    k === 'c' ? '<span class="claim" title="Product claim: confirm with the Supplier Portal PM">' + esc(v) + '</span>' :
    k === 'caret' ? (r.sugg.editing ? '<span class="caret" aria-hidden="true"></span>' : '') : '').join('');
}
function stepsHTML(a) {

/* ---------- Chrome bits ---------- */
function renderFab() {
  const p = pendingCount();
  return '<span class="w-av">' + I('pen', 14) + '</span>Writer' + (p ? '<span class="count">' + p + '</span>' : '');
}
function renderSwitcher() {
  const dark = document.documentElement.classList.contains('dark');
  return '<span class="lbl">Direction C</span>' +
    '<button data-go="sketch" class="' + (S.view === 'sketch' ? 'on' : '') + '">' + I('grid', 14) + 'Sketch</button>' +
    '<button data-go="home" class="' + (S.view === 'home' ? 'on' : '') + '">' + I('home', 14) + 'Home</button>' +
    '<span class="vr"></span>' +
    '<button data-theme>' + I(dark ? 'sun' : 'moon', 14) + (dark ? 'Light' : 'Dark') + '</button>' +
    '<button data-companion class="' + (S.companion ? 'on' : '') + '">' + I('sparkle', 14) + 'Companion</button>';
}
let toastTimer;
function toast(title, sub) {
  const t = document.getElementById('toast');
  t.innerHTML = '<span class="ti">' + I('checkCircle', 20) + '</span><div><b>' + title + '</b><small>' + sub + '</small></div><button class="btn sm" data-undo-all>Undo</button>';
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 5000);
}

/* ---------- Render ---------- */
const $ = id => document.getElementById(id);
function render() {
  const root = document.documentElement.classList;
  root.toggle('view-sketch', S.view === 'sketch');
  root.toggle('view-home', S.view === 'home');
  root.toggle('companion-open', S.companion);
  const sc = $('scroller'), keep = sc.dataset.view === S.view ? sc.scrollTop : 0;
  $('titlebar').innerHTML = renderTitlebar();
  $('nav').innerHTML = renderNav();
  sc.innerHTML = S.view === 'home' ? renderHome() : renderSketch();
  sc.dataset.view = S.view;
  sc.style.scrollBehavior = 'auto'; sc.scrollTop = keep; sc.style.scrollBehavior = '';
  $('companion').innerHTML = renderCompanion();
  $('fab').innerHTML = renderFab();
  $('fab').setAttribute('aria-label', 'Open Writer' + (pendingCount() ? ', ' + pendingCount() + ' suggestions' : ''));
  $('switcher').innerHTML = renderSwitcher();
}
function resolve(id, st) {
  S.sugg[id] = st;
  if (S.infobar === 'hidden' && pendingCount() === 0) S.infobar = 'hidden'; else S.infobar = 'show';
  render();
  if (st === 'accepted') toast('Saved to Changes', 'Writer: tighten rows 2–3');
}

document.addEventListener('click', e => {
  const t = e.target.closest('button, a');
  if (!e.target.closest('.details-wrap') && S.details) { S.details = false; render(); }
  if (!t) return;
  const d = t.dataset;
  if (d.go) { e.preventDefault(); if (location.hash !== '#' + d.go) location.hash = d.go; else { S.view = d.go; render(); } return; }
  if ('accept' in d) return resolve(+d.accept, 'accepted');
  if ('reject' in d) return resolve(+d.reject, 'rejected');
  if ('undo' in d) return resolve(+d.undo, 'pending');
  if ('acceptAll' in d) { Object.keys(S.sugg).forEach(k => { if (S.sugg[k] === 'pending') S.sugg[k] = 'accepted'; }); S.infobar = 'show'; render(); toast('Saved to Changes', 'Writer: tighten rows 2–3'); return; }
  if ('undoAll' in d) { Object.keys(S.sugg).forEach(k => S.sugg[k] = 'pending'); S.infobar = 'show'; $('toast').classList.remove('show'); render(); return; }
  if ('dismiss' in d) { S.infobar = 'hidden'; render(); return; }
  if ('details' in d) { S.details = !S.details; render(); return; }
  if ('companion' in d) { S.companion = !S.companion; render(); return; }
  if ('theme' in d) { document.documentElement.classList.toggle('dark'); render(); return; }
  if ('ham' in d) { document.documentElement.classList.toggle('rail'); return; }
  if ('review' in d) {
    if (S.view !== 'sketch') { location.hash = 'sketch'; return; }
    if (!wideMQ.matches) { S.companion = false; render(); }
    const r = $('row-2');
    if (r) { r.scrollIntoView({ block: 'center' }); r.classList.remove('flash'); void r.offsetWidth; r.classList.add('flash'); r.focus({ preventScroll: true }); }
  }
});
$('fab').addEventListener('click', () => { S.companion = true; render(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (S.details) { S.details = false; render(); }
    else if (S.companion && !wideMQ.matches) { S.companion = false; render(); $('fab').focus(); }
  }
});
addEventListener('hashchange', () => { S.view = location.hash === '#home' ? 'home' : 'sketch'; S.details = false; S.companion = defaultCompanion(); render(); });
wideMQ.addEventListener('change', () => { S.companion = defaultCompanion(); render(); });
render();

</script>
