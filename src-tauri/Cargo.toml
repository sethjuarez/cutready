[package]
name = "cutready"
version = "1.33.0"
edition = "2021"
description = "Product demo video authoring tool"

[lib]
name = "cutready_lib"
crate-type = ["lib", "cdylib", "staticlib"]

# Harness adapter selection (issue #251). Each first-party agent-harness adapter
# is a sibling workspace crate; the app links which ones to compile in via these
# features. `default` keeps every adapter so stock builds are unchanged.
#
# `harness-agentive` and `harness-copilot-sdk` are genuinely optional adapters
# and can be dropped individually to slim a build. The prompty adapter is NOT
# optional: the app's durable run-state, agent memory, model discovery, and
# one-shot LLM helpers are built directly on the Prompty engine SDK
# (see engine/agent_state.rs, engine/memory.rs, engine/agent/llm.rs) and are not
# harness-swappable today. Fully decoupling "LLM backbone" from "agent harness"
# is tracked by the capability-provider seam work (#250).
[features]
default = ["harness-agentive", "harness-copilot-sdk"]
harness-agentive = ["dep:harness-agentive"]
harness-copilot-sdk = ["dep:harness-copilot-sdk"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
# CutReady-owned agent harness seam (issue #251). Holds the stable boundary
# DTOs, the capability/ownership contract, and the AgentHarness trait. The app
# depends on it; harness adapters depend only on it; it never depends on the app.
harness-contract = { path = "../crates/harness-contract" }
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = "0.3"
log = "0.4"
dirs = "6"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "net"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
scraper = "0.22"
tokio-stream = "0.1"
futures-util = "0.3"
# Agentive agent harness runtime. Pinned to a pushed origin/main rev so the API
# matches the adapter in engine/agent/harness/agentive.rs. Kept behind that
# adapter — no `agentive::*` type leaks past the harness boundary.
harness-agentive = { path = "../crates/harness-agentive", optional = true }
# GitHub Copilot SDK agent harness runtime (issue #247). Pinned to a pushed
# origin/main rev so the API matches the adapter in
# engine/agent/harness/copilot_sdk.rs. Kept behind that adapter — no
# `copilot_sdk::*` type leaks past the harness boundary.
harness-copilot-sdk = { path = "../crates/harness-copilot-sdk", optional = true }
harness-prompty = { path = "../crates/harness-prompty" }
draftline = "0.2.15"
keyring = "4.1.2"
xcap = "0.8"
image = "0.25"
base64 = "0.22"
sha2 = "0.10"
rand = "0.9"
urlencoding = "2"
zip = "2"
quick-xml = "0.37"
pdf-extract = "0.8"
rusqlite = "0.37"
tempfile = "3"

# Tauri plugins
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
tauri-plugin-auditaur = "0.4.7"
tauri-plugin-single-instance = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2.5.3"
tauri-plugin-stronghold = "2"

prompty = { version = "2.0.0-beta.4" }
prompty-openai = { version = "2.0.0-beta.4" }
prompty-foundry = { version = "2.0.0-beta.4" }
prompty-anthropic = { version = "2.0.0-beta.4" }
portable-pty = "0.9.0"

# Vendor OpenSSL on macOS to support cross-compilation (ARM → Intel)
[target.'cfg(target_os = "macos")'.dependencies]
openssl-sys = { version = "0.9", features = ["vendored"] }
screencapturekit = "2"

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.23.0"
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
windows-capture = "2.0.0"

[dev-dependencies]
httpmock = "0.7"
