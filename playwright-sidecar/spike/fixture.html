<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>CutReady calibration fixture</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { font-family: system-ui, sans-serif; background: #f4f1ec; color: #222; }
    header { height: 120px; display: flex; align-items: center; gap: 24px; padding: 0 40px; background: #2b2926; color: #fff; }
    button { font-size: 28px; padding: 16px 32px; border: 0; border-radius: 8px; background: #6b5ce7; color: #fff; }
    #panel { display: none; height: 300px; background: #12a150; color: #fff; font-size: 48px; padding: 40px; }
    #panel.open { display: block; }
    #name { font-size: 64px; width: 90%; margin: 40px; padding: 12px; border: 4px solid #2b2926; }
    .filler { height: 600px; margin: 40px; background: repeating-linear-gradient(45deg, #ddd 0 40px, #bbb 40px 80px); }
    #footer { height: 400px; background: #1d4ed8; color: #fff; font-size: 48px; padding: 40px; }
  </style>
</head>
<body>
  <header>
    <button id="open" data-testid="open-panel">Open panel</button>
    <span id="status">closed</span>
  </header>
  <section id="panel" role="region" aria-label="Panel">Panel is open</section>
  <input id="name" aria-label="Greeting" placeholder="Type here" />
  <div class="filler"></div>
  <div class="filler"></div>
  <section id="footer">Footer</section>
  <script>
    document.getElementById("open").addEventListener("click", () => {
      document.getElementById("panel").classList.add("open");
      document.getElementById("status").textContent = "open";
    });
  </script>
</body>
</html>
