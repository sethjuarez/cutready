# cutready-core must stay host-neutral: no subprocesses, no direct filesystem,
# clock or environment access. Go through the ports in `src/ports/` instead.
# Clippy reads only the nearest clippy.toml, so this repeats the root settings.
allow-unwrap-in-tests = true
disallowed-types = [
  { path = "std::process::Command", reason = "core never spawns processes" },
  { path = "std::fs::File", reason = "use the Files port" },
  { path = "std::fs::OpenOptions", reason = "use the Files port" },
  { path = "std::fs::ReadDir", reason = "use the Files port" },
  { path = "std::time::SystemTime", reason = "use the Clock port" },
]
disallowed-methods = [
  { path = "std::process::Command::new", reason = "core never spawns processes" },
  { path = "std::fs::read", reason = "use the Files port" },
  { path = "std::fs::read_to_string", reason = "use the Files port" },
  { path = "std::fs::write", reason = "use the Files port" },
  { path = "std::fs::remove_file", reason = "use the Files port" },
  { path = "std::fs::rename", reason = "use the Files port" },
  { path = "std::fs::create_dir_all", reason = "use the Files port" },
  { path = "std::fs::create_dir", reason = "use the Files port" },
  { path = "std::fs::remove_dir", reason = "use the Files port" },
  { path = "std::fs::remove_dir_all", reason = "use the Files port" },
  { path = "std::fs::read_dir", reason = "use the Files port" },
  { path = "std::fs::metadata", reason = "use the Files port" },
  { path = "std::fs::symlink_metadata", reason = "use the Files port" },
  { path = "std::fs::canonicalize", reason = "use the Files port" },
  { path = "std::fs::copy", reason = "use the Files port" },
  { path = "std::fs::hard_link", reason = "use the Files port" },
  { path = "std::path::Path::exists", reason = "use the Files port" },
  { path = "std::path::Path::is_file", reason = "use the Files port" },
  { path = "std::path::Path::is_dir", reason = "use the Files port" },
  { path = "std::path::Path::metadata", reason = "use the Files port" },
  { path = "std::path::Path::canonicalize", reason = "use the Files port" },
  { path = "std::path::Path::read_dir", reason = "use the Files port" },
  { path = "std::time::Instant::now", reason = "use the Clock port" },
  { path = "std::env::var", reason = "hosts pass configuration in" },
  { path = "std::env::var_os", reason = "hosts pass configuration in" },
  { path = "std::env::vars", reason = "hosts pass configuration in" },
  { path = "std::env::vars_os", reason = "hosts pass configuration in" },
  { path = "std::env::current_dir", reason = "hosts pass the project root in" },
  { path = "std::env::set_current_dir", reason = "hosts pass the project root in" },
  { path = "std::env::temp_dir", reason = "hosts pass paths in" },
  { path = "std::env::home_dir", reason = "hosts pass paths in" },
]
