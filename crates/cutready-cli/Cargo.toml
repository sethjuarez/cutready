[package]
name = "cutready-cli"
version = "1.37.0"
edition = "2021"
publish = false
description = "The CutReady command line (`cutready-cli`): edit and validate project documents and serve them to agents over MCP (stdio), through the same core and op log as the app."

[lib]
name = "cutready_cli"

[[bin]]
# The app binary is already `cutready`; both build into one target dir.
name = "cutready-cli"
path = "src/main.rs"

[dependencies]
cutready-core = { path = "../cutready-core" }
cutready-desktop-io = { path = "../cutready-desktop-io" }
dirs = "6"
semver = "1"
serde_json = "1"

[dev-dependencies]
chrono = "0.4"
git2 = { version = "0.21", default-features = false }
tempfile = "3"
