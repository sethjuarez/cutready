[package]
name = "harness-contract"
version = "0.1.0"
edition = "2021"
description = "CutReady-owned agent harness seam: the stable boundary DTOs, capability/ownership contract, and the AgentHarness trait. Harness adapters depend on this crate; it never depends on the app crate."

[lib]
name = "harness_contract"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
