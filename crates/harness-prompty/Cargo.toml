[package]
name = "harness-prompty"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "harness_prompty"

[dependencies]
harness-contract = { path = "../harness-contract" }
prompty = { version = "2.0.0-beta.4" }
prompty-openai = { version = "2.0.0-beta.4" }
prompty-foundry = { version = "2.0.0-beta.4" }
prompty-anthropic = { version = "2.0.0-beta.4" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
tracing = "0.1"
tokio = { version = "1", features = ["sync"] }
