name: CI

# Pull request gate. Jobs call the same `npm run check:*` scripts used locally.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - "Cargo.toml"
              - "Cargo.lock"
              - "src-tauri/**"
              - "crates/**"
              - ".cargo/**"
              - "rust-toolchain*"
              - "extensions/**"
              - ".github/workflows/ci.yml"

  frontend:
    name: Frontend
    needs: changes
    # Playwright's Chromium does not support ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - run: npm run check:frontend

      - run: npm ci --prefix playwright-sidecar
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      # take.test.mjs drives a real page to check the DOM witness. It uses the
      # runner's Chrome; installing Playwright's Chromium hangs on extraction.
      - run: npx playwright install ffmpeg
        working-directory: playwright-sidecar
        timeout-minutes: 5

      - run: npm run check:sidecar
        env:
          CUTREADY_TEST_BROWSER_CHANNEL: chrome

  rust:
    name: Rust (Linux)
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # clippy, check:core and the workspace tests share one target dir that
      # outgrows the stock runner's free space; drop preinstalled SDKs we never use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libpipewire-0.3-dev libgbm-dev

      # The iOS target lets check:core prove cutready-core still builds for iOS.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-linux

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # The Elucim frame renderer tests run through the sidecar's @elucim/cli.
      - run: npm ci --prefix playwright-sidecar
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      # Clippy runs with -D warnings and the workspace lints (Cargo.toml), so
      # any warning fails the job.
      - run: npm run check:rust

      # The Copilot canvas talks to the cutready-cli binary built above.
      - run: npm run check:canvas

  rust-windows:
    name: Rust (Windows)
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-windows

      # Linux check:rust can't see cfg(windows) code; lint it here.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - run: cargo test --workspace --locked

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - run: npm run check:canvas

  # Lints cfg(target_os = "macos") desktop code, which Linux and Windows never compile.
  clippy-macos:
    name: Clippy (macOS)
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-macos-clippy

      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # The CLI ships for macOS too (release.yml); build it and run its tests there.
  cli-macos:
    name: CLI (macOS)
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-macos-cli

      - run: cargo build -p cutready-cli --locked

      - run: cargo test -p cutready-cli --locked

      - name: Smoke the binary
        run: ./target/debug/cutready-cli --version

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - run: npm run check:canvas
