name: Contracts

# Keeps the Typra SketchDocument contract, its generated outputs, and the
# desktop (Rust, TypeScript) and companion (Swift) bindings in lockstep.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "contracts/**"
      - "crates/cutready-contracts/**"
      - "src-tauri/src/models/sketch.rs"
      - "src-tauri/src/engine/sketch_edits.rs"
      - "src-tauri/src/lib.rs"
      - "ios/Package.swift"
      - "ios/Sources/CutReadyMobileCore/**"
      - "ios/Tests/CutReadyContractConformanceTests/**"
      - "ios/Tests/CutReadyMobileCoreTests/SketchDocumentTests.swift"
      - "src/contracts/**"
      - "src/types/contract.ts"
      - "src/types/sketch.ts"
      - "src/utils/documentMetadata.ts"
      - "src/utils/storyboard.ts"
      - "src/test/documentMetadata.test.ts"
      - "src/test/setup.ts"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "package.json"
      - "package-lock.json"
      - "Cargo.lock"
      - ".github/workflows/contracts.yml"

permissions:
  contents: read

jobs:
  generated:
    name: Generated output is current
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install contract tooling
        run: npm ci
        working-directory: contracts

      - name: Regenerate and diff
        run: npm run check
        working-directory: contracts

  typescript:
    name: TypeScript conformance
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Type-check generated models and adapters
        run: npm run typecheck:contracts

      - name: Type-check frontend consumers of the contract types
        run: npx tsc --noEmit

      - name: Vector harness and timing regressions
        run: npx vitest run src/contracts src/test/documentMetadata.test.ts

  conformance:
    name: Rust and Swift conformance
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please--') }}
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Desktop conformance
        run: cargo test -p cutready-contracts

      - name: Desktop sketch model regressions
        run: cargo test -p cutready --lib models::sketch

      - name: Generated Swift package
        run: swift test --package-path contracts/generated/swift

      - name: Companion conformance
        run: swift test --package-path ios --filter 'CutReadyContractConformanceTests|SketchDocumentTests'
